services:
  db:
    image: postgres:16-alpine
    container_name: paperdesk_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperdesk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-paperdesk}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: paperdesk_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-paperdesk}}
      - FEED_MODE=${FEED_MODE:-sim}
      - PESSIMISTIC_FILLS=${PESSIMISTIC_FILLS:-true}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build: .
    container_name: paperdesk_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-paperdesk}}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    command: ["python", "-m", "app.jobs.scheduler"]

  caddy:
    image: caddy:2-alpine
    container_name: paperdesk_caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
