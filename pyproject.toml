[project]
name = "paper-desk"
version = "0.1.0"
description = "Realistic NSE equity paper trading engine and live execution dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "greenlet>=3.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "pyarrow>=17.0.0",
    "polars>=1.6.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.9",
    "structlog>=24.4.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.111.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
