# Strategy Weights & Rules Configuration
# Effective Date: 2026-10-01

composite_weights:
  momentum_return_15m: 0.25   # 15-minute return momentum
  relative_volume: 0.20       # RVOL relative to historical minute baseline
  order_book_imbalance: 0.15  # 5-level order book depth skew
  vwap_deviation: 0.15        # Current price vs session VWAP
  relative_strength: 0.15     # Performance vs Nifty 50
  spread_penalty: -0.10       # Penalty for wide bid-ask spread

universe_funnel:
  min_daily_turnover_cr: 5.0  # ₹5 Crore minimum average daily traded value
  min_price: 20.0             # Exclude sub-₹20 penny stocks
  max_spread_pct: 0.15        # Spread < 0.15% of midpoint
  exclude_surveillance: true  # Exclude ASM / GSM categorized stocks
  exclude_circuits: true      # Exclude stocks hitting upper/lower circuits

strategies:
  orb:
    name: "Opening Range Breakout"
    enabled: true
    start_time: "09:30:00"
    min_rvol: 1.5
    min_obi: 0.0
    require_above_vwap: true
    atr_stop_multiple: 1.5
    atr_target_multiple: 2.5
    time_stop_minutes: 45

  vwap_reversion:
    name: "VWAP Mean Reversion"
    enabled: true
    min_zscore: -2.0
    require_microprice_above_mid: true
    max_vix: 16.0
    atr_stop_multiple: 1.5
    atr_target_multiple: 2.0
    time_stop_minutes: 45
